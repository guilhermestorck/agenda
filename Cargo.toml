[package]
name = "agenda"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4", "v1_5"] }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
getrandom = "0.4.3"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_10", "v4_12"] }
ksni = { version = "0.3.6", features = ["blocking", "tokio"] }
notify-rust = "4.18.0"
oo7 = { version = "0.6.0", features = ["tokio", "native_crypto"] }
reqwest = { version = "0.13.5", features = ["form", "json", "query"] }
rrule = "0.14.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
