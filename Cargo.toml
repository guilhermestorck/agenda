[package]
name = "agenda"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
anyhow = "1.0.104"
base64 = "0.23.1"
getrandom = "0.4.3"
gtk = { version = "0.11.4", package = "gtk4" }
oo7 = { version = "0.6.0", features = ["tokio", "native_crypto"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
